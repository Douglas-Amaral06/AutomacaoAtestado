services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atestados_test
      POSTGRES_USER: atestados
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atestados -d atestados_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
